name: EAS Build — Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Write .env file
        run: echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Push Gemini key into Expo's secret vault so EAS Build can access it.
      - name: Set Gemini API key as EAS secret
        run: eas secret:push --scope project --env-file <(echo "EXPO_PUBLIC_GEMINI_API_KEY=$GEMINI_API_KEY") --force
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # The EAS build runs in Expo's cloud — no Android SDK needed locally.
      - name: Trigger EAS APK build
        run: eas build --platform android --profile preview --non-interactive
